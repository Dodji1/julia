[project]
name = "julia"
version = "0.1.0"
description = "Julia, assistante juridique sourcée (Vitalia) — backend et pipeline"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["db: nécessite PostgreSQL + pgvector (variable JULIA_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"
