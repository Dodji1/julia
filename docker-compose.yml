# Développement : base seule (docker compose up -d db) ou base + API (docker compose up --build).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: julia
      POSTGRES_USER: julia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-julia-dev}
    ports:
      # Port peu courant : 5432 et 5433 sont souvent pris par un PostgreSQL installé sur le poste.
      - "127.0.0.1:${JULIA_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julia -d julia"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    environment:
      JULIA_ENGINE: postgres
      JULIA_DATABASE_URL: postgresql://julia:${POSTGRES_PASSWORD:-julia-dev}@db:5432/julia
      JULIA_DATA_RAW_DIR: /app/data/raw
    volumes:
      - ./data/raw:/app/data/raw:ro
      - hf-cache:/home/julia/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
